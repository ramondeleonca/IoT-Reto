; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32 ; https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
lib_deps = 
    https://github.com/adafruit/Adafruit_VL53L0X.git#1.2.5
	https://github.com/adafruit/Adafruit_BusIO#1.17.4
    https://github.com/madhephaestus/ESP32Servo.git#3.2.1
build_flags = 
    -O

; [env:esp8266]
; board = esp01
; platform = espressif8266
; framework = arduino
