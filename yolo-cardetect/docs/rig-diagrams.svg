<?xml version="1.0" encoding="UTF-8"?>
<!--
  rig-diagrams.svg: the two supported camera mountings, drawn to scale.

  @file    rig-diagrams.svg
  @brief   Hand-authored side elevation of both pole configurations with the measured quantities
           labelled, so a rig can be built and measured from the drawing alone.
  @details Left panel is configuration A (overhead pole), right panel is configuration B (roadside
           pole). Both are drawn at the same physical scale, which is what makes the comparison
           meaningful: the overhead camera is close and the roadside camera is far, and that
           difference – not the choice of model or estimator – is what determines how accurately
           each rig can measure speed.

           The numbers on the drawing are the values from config/camera_topdown.yaml and
           config/camera_roadside.yaml with the default 1280x720, 70 degree field of view. Every
           labelled quantity is one the calibration actually needs, and the notes name where to
           measure it, because measuring height to the wrong reference is the single most common
           way to get a constant, invisible speed bias.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 980" width="1180" height="980"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2e8f0"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrow-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <linearGradient id="coneA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="coneB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#475569" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1180" height="980" fill="#0b1220"/>

  <!-- ============================ titles ============================ -->
  <text x="24" y="36" fill="#f1f5f9" font-size="21" font-weight="700">Both supported mountings, same physical scale</text>
  <text x="24" y="58" fill="#94a3b8" font-size="13">
    A: overhead pole, affine ground model, constant scale. B: roadside pole, full projective homography, scale degrades with distance.
  </text>
  <text x="24" y="76" fill="#64748b" font-size="12">
    Values shown are the defaults in config/camera_*.yaml at 1280&#215;720 with a 70&#176; horizontal field of view.
  </text>
  <line x1="592" y1="20" x2="592" y2="676" stroke="#1e293b" stroke-width="1"/>
  <line x1="24" y1="760" x2="1156" y2="760" stroke="#1e293b" stroke-width="1"/>

  <!-- ======================== PANEL A: OVERHEAD ======================== -->
  <text x="196" y="112" fill="#7dd3fc" font-size="16" font-weight="700" text-anchor="middle">A &#183; overhead pole</text>
  <text x="196" y="131" fill="#64748b" font-size="11.5" text-anchor="middle">config/camera_topdown.yaml</text>

  <!-- ground / track -->
  <rect x="40" y="470" width="512" height="34" fill="url(#hatch)"/>
  <rect x="40" y="470" width="512" height="3" fill="#64748b"/>
  <text x="52" y="494" fill="#cbd5e1" font-size="11">track surface (height measured from here, not the table)</text>

  <!-- cone of view: 70 deg wide, centred on the optical axis pointing straight down -->
  <polygon points="196,150 88,470 304,470" fill="url(#coneA)"/>
  <line x1="196" y1="150" x2="88" y2="470" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1"/>
  <line x1="196" y1="150" x2="304" y2="470" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1"/>
  <line x1="196" y1="150" x2="196" y2="470" stroke="#38bdf8" stroke-dasharray="5 4" stroke-width="1.2"/>
  <text x="204" y="300" fill="#7dd3fc" font-size="11">optical axis</text>
  <text x="204" y="314" fill="#7dd3fc" font-size="11">vertical (pitch 90&#176;)</text>

  <!-- pole and camera -->
  <rect x="190" y="150" width="12" height="320" fill="#334155" stroke="#475569" stroke-width="1"/>
  <rect x="176" y="136" width="40" height="18" rx="3" fill="#0ea5e9" stroke="#7dd3fc" stroke-width="1.5"/>
  <circle cx="196" cy="158" r="4.5" fill="#0b1220" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="228" y="150" fill="#7dd3fc" font-size="11.5" font-weight="600">lens entrance pupil</text>

  <!-- height dimension -->
  <line x1="120" y1="145" x2="120" y2="470" stroke="#7dd3fc" stroke-width="1.2" marker-start="url(#arrow-dim)" marker-end="url(#arrow-dim)"/>
  <text x="112" y="310" fill="#7dd3fc" font-size="12.5" font-weight="700" text-anchor="end">h = 0.85 m</text>
  <text x="112" y="326" fill="#64748b" font-size="10.5" text-anchor="end">to the lens, above the</text>
  <text x="112" y="338" fill="#64748b" font-size="10.5" text-anchor="end">surface the cars run on</text>

  <!-- visible span -->
  <line x1="88" y1="504" x2="304" y2="504" stroke="#7dd3fc" stroke-width="1.2" marker-start="url(#arrow-dim)" marker-end="url(#arrow-dim)"/>
  <text x="196" y="524" fill="#7dd3fc" font-size="12" font-weight="700" text-anchor="middle">visible depth &#8776; 0.67 m</text>
  <text x="196" y="540" fill="#64748b" font-size="10.5" text-anchor="middle">height &#215; frame height / focal length</text>

  <g transform="translate(196 452)">
    <rect x="-22" y="-13" width="44" height="13" rx="2.5" fill="#facc15"/>
    <circle cx="-13" cy="2" r="3.4" fill="#1e293b"/><circle cx="13" cy="2" r="3.4" fill="#1e293b"/>
  </g>
  <text x="196" y="446" fill="#facc15" font-size="10.5" text-anchor="middle">1:64 car</text>

  <!-- result box -->
  <rect x="40" y="556" width="512" height="104" rx="8" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="56" y="578" fill="#7dd3fc" font-size="12.5" font-weight="700">what this rig gives you</text>
  <text x="56" y="599" fill="#cbd5e1" font-size="11.5">&#8226; 0.93 mm of road per pixel, <tspan fill="#7dd3fc" font-weight="700">uniform across the whole frame</tspan></text>
  <text x="56" y="617" fill="#cbd5e1" font-size="11.5">&#8226; 2 px of detector jitter &#8594; 1.9 mm of position error, <tspan fill="#7dd3fc" font-weight="700">anywhere in view</tspan></text>
  <text x="56" y="635" fill="#cbd5e1" font-size="11.5">&#8226; calibration needs a tape measure and <tspan fill="#7dd3fc">one</tspan> number: just h</text>
  <text x="56" y="652" fill="#fbbf24" font-size="11">&#9888; sees only ~0.67 m of road: keep the speed below ~0.35 m/s or the car exits mid-measurement</text>

  <!-- ======================== PANEL B: ROADSIDE ======================== -->
  <text x="880" y="112" fill="#c4b5fd" font-size="16" font-weight="700" text-anchor="middle">B &#183; roadside pole</text>
  <text x="880" y="131" fill="#64748b" font-size="11.5" text-anchor="middle">config/camera_roadside.yaml</text>

  <!-- ground -->
  <rect x="600" y="470" width="556" height="34" fill="url(#hatch)"/>
  <rect x="600" y="470" width="556" height="3" fill="#64748b"/>

  <!-- horizon -->
  <line x1="600" y1="196" x2="1156" y2="196" stroke="#fbbf24" stroke-dasharray="7 5" stroke-width="1.3"/>
  <text x="1152" y="190" fill="#fbbf24" font-size="11" text-anchor="end">horizon (row &#8722;280, above frame)</text>

  <!-- cone, 70 deg H / ~42 V, pitched 35 deg down -->
  <polygon points="648,152 900,470 1156,470" fill="url(#coneB)"/>
  <line x1="648" y1="152" x2="1156" y2="470" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="648" y1="152" x2="900" y2="470" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1"/>

  <!-- pole and camera -->
  <rect x="642" y="152" width="12" height="318" fill="#334155" stroke="#475569" stroke-width="1"/>
  <rect x="628" y="138" width="40" height="18" rx="3" fill="#7c3aed" stroke="#c4b5fd" stroke-width="1.5"/>
  <circle cx="648" cy="160" r="4.5" fill="#0b1220" stroke="#c4b5fd" stroke-width="1.5"/>

  <!-- pitch angle arc -->
  <path d="M 700 160 A 52 52 0 0 1 686 196" fill="none" stroke="#fbbf24" stroke-width="1.3"/>
  <line x1="648" y1="160" x2="760" y2="160" stroke="#fbbf24" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="648" y1="160" x2="1010" y2="428" stroke="#c4b5fd" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="716" y="146" fill="#fbbf24" font-size="12" font-weight="700">pitch 35&#176;</text>
  <text x="700" y="200" fill="#c4b5fd" font-size="11">optical axis</text>

  <!-- height dimension -->
  <line x1="600" y1="148" x2="600" y2="470" stroke="#c4b5fd" stroke-width="1.2" marker-start="url(#arrow-dim)" marker-end="url(#arrow-dim)"/>
  <text x="608" y="316" fill="#c4b5fd" font-size="12.5" font-weight="700">h = 1.5 m</text>
  <text x="608" y="332" fill="#64748b" font-size="10.5">lens height above the road</text>

  <!-- distance ruler with error growth -->
  <line x1="700" y1="500" x2="1156" y2="500" stroke="#94a3b8" stroke-width="1"/>
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="700" y1="495" x2="700" y2="505"/><line x1="814" y1="495" x2="814" y2="505"/>
    <line x1="928" y1="495" x2="928" y2="505"/><line x1="1042" y1="495" x2="1042" y2="505"/>
    <line x1="1156" y1="495" x2="1156" y2="505"/>
  </g>
  <text x="700" y="520" fill="#94a3b8" font-size="10.5" text-anchor="middle">0</text>
  <text x="928" y="520" fill="#94a3b8" font-size="10.5" text-anchor="middle">3 m</text>
  <text x="1156" y="520" fill="#94a3b8" font-size="10.5" text-anchor="end">6 m</text>

  <!-- error bars growing with distance -->
  <g fill="#fbbf24" fill-opacity="0.85">
    <rect x="734" y="474" width="6" height="10" rx="1"/>
    <rect x="802" y="470" width="7" height="14" rx="1"/>
    <rect x="876" y="462" width="9" height="22" rx="1"/>
    <rect x="956" y="450" width="12" height="34" rx="1"/>
    <rect x="1042" y="434" width="15" height="50" rx="1"/>
  </g>
  <text x="700" y="428" fill="#fbbf24" font-size="11" font-weight="600">positional error grows with distance (2 px jitter)</text>
  <line x1="700" y1="436" x2="1060" y2="436" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="3 3" marker-end="url(#arrow-err)"/>

  <!-- usable range marker -->
  <line x1="1120" y1="440" x2="1120" y2="500" stroke="#ef4444" stroke-width="1.6"/>
  <text x="1112" y="452" fill="#ef4444" font-size="10.5" font-weight="700" text-anchor="end">usable range 6.1 m</text>
  <text x="1112" y="466" fill="#ef4444" font-size="10" text-anchor="end">beyond: outside the 5 cm budget</text>

  <g transform="translate(880 452)">
    <rect x="-30" y="-15" width="60" height="15" rx="3" fill="#22d3ee"/>
    <circle cx="-18" cy="2" r="3.6" fill="#1e293b"/><circle cx="18" cy="2" r="3.6" fill="#1e293b"/>
  </g>
  <text x="880" y="446" fill="#22d3ee" font-size="10.5" text-anchor="middle">real car</text>

  <!-- result box -->
  <rect x="600" y="556" width="556" height="104" rx="8" fill="#0f172a" stroke="#3b2f63" stroke-width="1"/>
  <text x="616" y="578" fill="#c4b5fd" font-size="12.5" font-weight="700">what this rig gives you</text>
  <text x="616" y="599" fill="#cbd5e1" font-size="11.5">&#8226; 2.1 mm/px at 1 m &#8594; 24.3 mm/px at 6 m: <tspan fill="#c4b5fd" font-weight="700">scale is not constant</tspan></text>
  <text x="616" y="617" fill="#cbd5e1" font-size="11.5">&#8226; anisotropy rises 1.3 &#8594; 4.3 across the usable stretch (foreshortening)</text>
  <text x="616" y="635" fill="#cbd5e1" font-size="11.5">&#8226; a tape measure <tspan fill="#c4b5fd">alone is not enough</tspan>; add a horizon, height or tilt</text>
  <text x="616" y="652" fill="#fbbf24" font-size="11">&#9888; far detections are gated, deliberately: one bad sample would dominate a short window</text>

  <!-- ======================== shared footer ======================== -->
  <rect x="24" y="686" width="1132" height="52" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="40" y="707" fill="#e2e8f0" font-size="11.5" font-weight="700">Both panels: the red/amber figures are the reason this project reports an error budget rather than a single number.</text>
  <text x="40" y="725" fill="#94a3b8" font-size="11">Speed is a difference of positions divided by time, so the positional resolution at each sample sets a hard floor on achievable accuracy.</text>

  <!-- ================== how to measure the two numbers that matter ================== -->
  <text x="24" y="800" fill="#f1f5f9" font-size="14" font-weight="700">The two measurements that decide your accuracy</text>

  <text x="24" y="828" fill="#7dd3fc" font-size="12" font-weight="700">1. Lens height h</text>
  <text x="24" y="847" fill="#cbd5e1" font-size="11.5">Measure to the <tspan fill="#f1f5f9" font-weight="600">lens entrance pupil</tspan>, not the bracket, phone body or pole top.</text>
  <text x="24" y="864" fill="#cbd5e1" font-size="11.5">Measure from the <tspan fill="#f1f5f9" font-weight="600">surface the cars run on</tspan>, not the table or the floor beneath it.</text>
  <text x="24" y="881" fill="#fbbf24" font-size="11">Each mistake here biases every speed by exactly the height ratio, and nothing downstream can detect it.</text>

  <text x="620" y="828" fill="#c4b5fd" font-size="12" font-weight="700">2. Pitch, or the horizon row</text>
  <text x="620" y="847" fill="#cbd5e1" font-size="11.5">A phone inclinometer reads pitch directly, or read the horizon off a frame and pass <tspan fill="#c4b5fd">--horizon-row</tspan>.</text>
  <text x="620" y="864" fill="#cbd5e1" font-size="11.5">The horizon must come from a feature <tspan fill="#f1f5f9" font-weight="600">in the road plane</tspan>: a kerb qualifies, the top of a wall does not.</text>
  <text x="620" y="881" fill="#fbbf24" font-size="11">On the roadside rig a lone tape measurement cannot separate height from pitch; one of the two is required.</text>

</svg>
